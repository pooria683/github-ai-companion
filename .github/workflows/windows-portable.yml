name: Build Windows Portable App

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build portable Windows executable
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Package portable EXE
        run: npx electron-builder --win portable --x64 --publish never

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: GitHubAICompanion-Portable-${{ github.ref_name }}
          path: release/GitHubAICompanion-Portable-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $asset = Get-ChildItem "release/GitHubAICompanion-Portable-*.exe" | Select-Object -ExpandProperty FullName
          if (-not $asset) { throw "Portable EXE not found in release/" }
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $asset --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $asset --title "GitHub AI Companion $env:GITHUB_REF_NAME" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed." }
